[project]
name = "o2c-agent"
version = "0.1.0"
description = "SAP Order-to-Cash agent team built with Google ADK and MCP"
requires-python = ">=3.9"
dependencies = [
    # ADK
    "google-adk>=1.0.0",
    # MCP (required for McpToolset / StdioServerParameters)
    "mcp[cli]>=1.0.0",
    # Env vars
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["o2c_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
